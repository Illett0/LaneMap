<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaneMap エディタ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2933;--muted:#5f6b7a;--line:#d9dee4;--accent:#2f5f98;--accent-soft:#e7eef8;
  --err:#b42318;--err-bg:#fef3f2;--warn:#93370d;--warn-bg:#fffaeb;--sel:#f08c00}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;
  display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
.file{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:4px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted)}
.status.dirty{color:var(--warn);font-weight:700}
#banner{display:none;padding:8px 14px;background:var(--warn-bg);border-bottom:1px solid #fedf89;color:var(--warn)}
#banner.show{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#banner.error{background:var(--err-bg);color:var(--err);border-color:#fecdca}
#banner.ok{background:#ecfdf3;color:#05603a;border-color:#abefc6}
.layout{display:grid;grid-template-columns:minmax(440px,560px) 1fr;min-height:0}
.left{display:grid;grid-template-rows:minmax(160px,38%) auto 1fr;min-height:0;border-right:1px solid var(--line)}
.list{overflow:auto;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#eef1f4;text-align:left;font-weight:600;padding:4px 6px;font-size:12px;color:var(--muted);z-index:1}
td{padding:3px 6px;border-top:1px solid #eef0f2;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover{background:#f7f9fb}
tr.row.on{background:var(--accent-soft)}
td.lanes{font-family:"Segoe UI Symbol","Yu Gothic UI",sans-serif;letter-spacing:1px}
.muted{color:var(--muted)}
.kind{display:inline-block;padding:0 6px;border-radius:3px;color:#fff;font-size:11px;font-weight:700}
.k-手前{background:#c2410c}.k-直後{background:#0f766e}.k-区間中{background:#6b7280}.k-x{background:#d92d20}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;text-align:center}
.b-err{background:var(--err-bg);color:var(--err)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.rowops{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfc;align-items:center}
.form{overflow:auto;padding:10px 12px 40px}
.form h2{font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px;background:var(--card)}
legend{font-size:12px;font-weight:700;color:var(--muted);padding:0 4px}
.grid2{display:grid;grid-template-columns:80px 1fr;gap:6px 8px;align-items:center}
.grid2 label{font-size:12px;color:var(--muted)}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff}
textarea{min-height:52px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:56px;padding:4px;border:1px dashed var(--line);border-radius:6px;background:#fbfcfd}
.chip{width:46px;height:52px;border:2px solid var(--accent);border-radius:5px;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.chip .g{font-size:18px;font-family:"Segoe UI Symbol","Yu Gothic UI",sans-serif}
.chip small{font-size:10px;opacity:.85}
.chip .n{position:absolute;top:-1px;left:3px;font-size:9px;opacity:.8}
.chip.on{outline:3px solid var(--sel);outline-offset:1px}
.chip.bad{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.chips .empty{color:var(--muted);font-size:12px;align-self:center;padding:0 6px}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.palette button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 8px;font-size:12px}
.palette button .g{font-family:"Segoe UI Symbol",sans-serif;font-size:15px;margin-right:2px}
.palette button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ops{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lr{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 2px 2px}
.conn{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}
.conn .src{font-size:12px;white-space:nowrap}
.conn .dst{display:flex;gap:4px;align-items:center}
.conn .dst select{width:auto;flex:0 0 auto}
.conn .dst input{flex:1;min-width:80px}
.auto{font-size:12px;padding:4px 8px;border-radius:5px;background:#f2f4f7;margin-top:6px}
.auto.ng{background:var(--warn-bg);color:var(--warn)}
.confseg button{min-width:52px}
.rowissues{list-style:none;margin:0;padding:0;font-size:12px}
.rowissues li{padding:2px 6px;border-radius:4px;margin-bottom:2px}
.right{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.ptools{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.preview{overflow:auto;padding:12px;background:#eef1f4}
.preview svg{max-width:none;background:#fff;border:1px solid var(--line);border-radius:6px;display:block}
.preview [data-line]{cursor:pointer}
.lint{max-height:32vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 12px}
.lint h3{font-size:13px;margin:2px 0 4px}
.lint ul{list-style:none;margin:0;padding:0;font-size:12px}
.lint li{padding:2px 6px;border-radius:4px;cursor:pointer}
.lint li:hover{background:#f2f4f7}
.lv-エラー{color:var(--err);background:var(--err-bg)}
.lv-警告{color:var(--warn)}
.lv-情報{color:var(--muted)}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff}
@media (max-width:980px){
  body{display:block;overflow:auto}
  header{position:sticky;top:0;z-index:3}
  .layout{display:block}
  .left{display:block;border-right:0}
  .list{max-height:40vh}
  .form{overflow:visible}
  .right{display:block}
  .preview{overflow:auto;max-height:80vh}
  .lint{max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>LaneMap エディタ</h1>
  <span class="file" id="file"></span>
  <span class="seg" id="dirs"></span>
  <span class="status" id="progress"></span>
  <span class="spacer"></span>
  <span class="status" id="status">読み込み中…</span>
  <button class="btn" id="undo" title="元に戻す（Ctrl+Z）">↶ 元に戻す</button>
  <button class="btn primary" id="save" title="Ctrl+S">保存</button>
  <a class="btn" href="/view" target="_blank" rel="noopener">図を別タブで開く</a>
  <button class="btn" id="quit" title="エディタのサーバーを止めます">終了</button>
</header>
<div id="banner"></div>
<div class="layout">
  <section class="left">
    <div class="list"><table><thead><tr><th>行</th><th>順</th><th>地点</th><th>種別</th><th>車線</th><th>確度</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="rowops">
      <button class="btn small" id="add" title="選んだ行の下に追加">＋ 下に行を追加</button>
      <button class="btn small" id="dup">複製</button>
      <button class="btn small" id="up" title="Alt+Shift+↑">↑ 上へ</button>
      <button class="btn small" id="down" title="Alt+Shift+↓">↓ 下へ</button>
      <button class="btn small" id="del">削除</button>
      <span class="spacer"></span>
      <button class="btn small" id="nextBlank" title="車線が未入力の次の行へ">次の未入力へ →</button>
    </div>
    <div class="form" id="form"></div>
  </section>
  <section class="right">
    <div class="ptools">
      <span class="muted">図の向き</span>
      <span class="seg" id="views"><button data-v="map">上空から見た向き</button><button data-v="csv">CSV の並び順</button></span>
      <span class="muted" style="font-size:12px">図の車線・地点名をクリックするとその行を選びます。<kbd>Alt</kbd>+<kbd>↑↓</kbd> で行の移動</span>
    </div>
    <div class="preview" id="preview"></div>
    <div class="lint" id="lint"></div>
  </section>
</div>

<script>
'use strict';
const GLYPH = {L:'↰',S:'↑',R:'↱',SL:'↰↑',SR:'↑↱',LSR:'↰↑↱',B:'バス','?':'?'};
const CODE_NAME = {L:'左折専用',S:'直進',R:'右折専用',SL:'直進・左折',SR:'直進・右折',LSR:'全方向',B:'バス',  '?':'不明'};
const CONFS = [['確','現地・ストリートビューで確認'],['資','資料にある'],['推','推定'],['','空欄（不明）']];
const st = {file:'', header:[], entries:[], codes:[], kinds:[], directions:[], dir:'南行き', view:'map',
  sel:null, lane:null, dirty:false, preview:null, undo:[], seq:0, newId:0, pendingUndo:false};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isRow = e => !('_raw' in e) && !e._header;
const lanesOf = e => (e['車線'] || '').trim() ? e['車線'].trim().split(/\s+/) : [];
const byId = id => st.entries.find(e => e._id === id);

// ---------------------------------------------------------------- データ
function dirOf(e){ return st.directions.includes(e['方向']) ? e['方向'] : 'その他'; }
function rowsOf(dir){
  return st.entries.filter(e => isRow(e) && dirOf(e) === dir)
    .sort((a,b) => ((parseInt(a['順'])||0) - (parseInt(b['順'])||0)) || (st.entries.indexOf(a) - st.entries.indexOf(b)));
}
function dirList(){
  const l = [...st.directions];
  if (st.entries.some(e => isRow(e) && dirOf(e) === 'その他')) l.push('その他');
  return l;
}
function neighbors(e){
  const rows = rowsOf(dirOf(e)); const i = rows.indexOf(e);
  return {rows, i, prev: rows[i-1] || null, next: rows[i+1] || null};
}
// 方向ごとに順を 1..n に振り直し、ファイル内の並びも順に合わせる
function renumber(dir){
  const rows = rowsOf(dir);
  const slots = st.entries.map((e,i) => (isRow(e) && dirOf(e) === dir) ? i : -1).filter(i => i >= 0);
  rows.forEach((e,i) => { e['順'] = String(i + 1); st.entries[slots[i]] = e; });
}
function lineOf(id){ return st.preview?.lines?.[id]; }
function idOfLine(line){
  const m = st.preview?.lines || {};
  return Object.keys(m).find(k => m[k] === line);
}
function issuesOf(id){
  const line = lineOf(id);
  return line ? (st.preview?.issues || []).filter(i => i.line === line) : [];
}

// ---------------------------------------------------------------- 変更
function pushUndo(){
  st.undo.push(JSON.stringify(st.entries));
  if (st.undo.length > 200) st.undo.shift();
  $('#undo').disabled = false;
}
function changed(opts = {}){
  st.dirty = true;
  renderStatus();
  renderList();
  if (opts.form) renderForm();
  schedulePreview();
}
function edit(fn, opts = {form:true}){ pushUndo(); fn(); changed(opts); }
function doUndo(){
  if (!st.undo.length) return;
  st.entries = JSON.parse(st.undo.pop());
  if (st.sel && !byId(st.sel)) st.sel = null;
  $('#undo').disabled = !st.undo.length;
  st.lane = null;
  changed({form:true});
}

// ---------------------------------------------------------------- サーバー
async function api(path, body){
  const res = await fetch(path, body === undefined ? {} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  let data = null;
  try { data = await res.json(); } catch (_) {}
  return {status: res.status, data};
}
async function load(){
  const {data} = await api('/api/data');
  Object.assign(st, {file: data.file, header: data.header, entries: data.entries, codes: data.codes,
    kinds: data.kinds, directions: data.directions, dirty:false, undo:[]});
  $('#file').textContent = data.path;
  $('#file').title = '保存すると図も作り直します: ' + data.html;
  if (!st.sel || !byId(st.sel)) st.sel = rowsOf(st.dir)[0]?._id || null;
  $('#undo').disabled = true;
  renderAll();
  runPreview();
}
let timer = null;
function schedulePreview(){ clearTimeout(timer); timer = setTimeout(runPreview, 250); }
async function runPreview(){
  const seq = ++st.seq;
  const {status, data} = await api('/api/preview', {entries: st.entries});
  if (seq !== st.seq) return;
  if (status !== 200) { banner('図を作れませんでした: ' + (data?.error || status), 'error'); return; }
  st.preview = data;
  renderPreview(); renderLint(); renderList(); renderAutoAndIssues(); renderStatus();
}
async function save(force = false){
  clearTimeout(timer);
  const {status, data} = await api('/api/save', {entries: st.entries, force});
  if (status === 409) {
    banner(data.error, 'warn', [['再読み込み（編集を捨てる）', reload], ['上書き保存', () => save(true)]]);
    return;
  }
  if (status !== 200) { banner('保存できませんでした: ' + (data?.error || status), 'error'); return; }
  st.dirty = false;
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  st.savedAt = t;
  banner(data.changes ? `保存しました（変更 ${data.changes} 件）。図も作り直しました。バックアップ: history/backups/${data.backup || '—'}`
    : (data.message || '保存しました'), 'ok');
  setTimeout(() => { if ($('#banner').classList.contains('ok')) banner(''); }, 6000);
  renderStatus();
  runPreview();
}
async function reload(){
  await api('/api/reload', {});
  banner('');
  await load();
}
function banner(msg, kind = 'warn', actions = []){
  const b = $('#banner');
  b.className = msg ? `show ${kind}` : '';
  b.innerHTML = msg ? `<span>${esc(msg)}</span>` : '';
  actions.forEach(([label, fn]) => {
    const btn = document.createElement('button'); btn.className = 'btn small'; btn.textContent = label;
    btn.onclick = fn; b.appendChild(btn);
  });
  if (msg) { const x = document.createElement('button'); x.className = 'btn small'; x.textContent = '×'; x.onclick = () => banner(''); b.appendChild(x); }
}

// ---------------------------------------------------------------- 表示
function renderAll(){ renderDirs(); renderStatus(); renderList(); renderForm(); renderPreview(); renderLint(); }

function renderDirs(){
  $('#dirs').innerHTML = dirList().map(d => `<button data-d="${esc(d)}" class="${d === st.dir ? 'on' : ''}">${esc(d)}</button>`).join('');
  $('#dirs').querySelectorAll('button').forEach(b => b.onclick = () => {
    st.dir = b.dataset.d; st.sel = rowsOf(st.dir)[0]?._id || null; st.lane = null; renderAll();
  });
  $('#views').querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === st.view);
    b.onclick = () => { st.view = b.dataset.v; renderDirs(); renderPreview(); };
  });
}
function renderStatus(){
  const s = $('#status');
  s.textContent = st.dirty ? '● 未保存の変更があります' : (st.savedAt ? `保存済み（${st.savedAt}）` : '変更なし');
  s.className = 'status' + (st.dirty ? ' dirty' : '');
  const rows = rowsOf(st.dir); const done = rows.filter(e => lanesOf(e).length).length;
  const c = st.preview?.counts;
  $('#progress').textContent = `${st.dir}：車線入力済み ${done}/${rows.length} 行` + (c ? `　エラー ${c['エラー']} / 警告 ${c['警告']}` : '');
}
function lanesText(e){ const l = lanesOf(e); return l.length ? l.map(c => GLYPH[c] || c).join(' ') : '<span class="muted">未入力</span>'; }
function renderList(){
  const rows = rowsOf(st.dir);
  $('#rows').innerHTML = rows.map(e => {
    const iss = issuesOf(e._id);
    const ne = iss.filter(i => i.level === 'エラー').length, nw = iss.filter(i => i.level === '警告').length;
    const kind = e['種別'] || '';
    const kc = ['手前','直後','区間中'].includes(kind) ? kind : 'x';
    return `<tr class="row ${e._id === st.sel ? 'on' : ''}" data-id="${esc(e._id)}">
      <td class="muted">${lineOf(e._id) ?? ''}</td><td>${esc(e['順'])}</td><td>${esc(e['地点'])}</td>
      <td>${kind ? `<span class="kind k-${kc}">${esc(kind)}</span>` : ''}</td>
      <td class="lanes" title="${esc(e['車線'])}">${lanesText(e)}</td><td>${esc(e['確度'])}</td>
      <td>${ne ? `<span class="badge b-err" title="エラー">${ne}</span>` : ''}${nw ? `<span class="badge b-warn" title="警告">${nw}</span>` : ''}</td></tr>`;
  }).join('') || `<tr><td colspan="7" class="muted">行がありません。「＋ 下に行を追加」で作れます。</td></tr>`;
  $('#rows').querySelectorAll('tr.row').forEach(tr => tr.onclick = () => select(tr.dataset.id));
  const on = $('#rows tr.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function select(id){
  const e = byId(id); if (!e) return;
  if (dirOf(e) !== st.dir) { st.dir = dirOf(e); renderDirs(); }
  st.sel = id; st.lane = null;
  renderList(); renderForm(); renderPreview(); renderStatus();
}

// ---- 入力フォーム
function datalist(id, col){
  const vals = [...new Set(st.entries.filter(isRow).map(e => (e[col] || '').trim()).filter(Boolean))];
  return `<datalist id="${id}">${vals.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
}
function renderForm(){
  const f = $('#form');
  const e = byId(st.sel);
  if (!e) { f.innerHTML = '<p class="muted">左の一覧から行を選んでください。</p>'; return; }
  const {prev, next} = neighbors(e);
  const lanes = lanesOf(e);
  f.innerHTML = `
  <h2>${esc(e['方向'])} 順${esc(e['順'])} ${esc(e['地点'] || '（地点なし）')} <span class="muted" style="font-size:12px">${lineOf(e._id) ? lineOf(e._id) + '行目' : ''}</span></h2>
  <fieldset><legend>場所</legend><div class="grid2">
    <label for="f-point">地点</label><input type="text" id="f-point" list="dl-point" data-col="地点" value="${esc(e['地点'])}" placeholder="例: 七条堀川">
    <label>種別</label><span class="seg" id="f-kind">${st.kinds.map(k => `<button data-k="${k}" class="${e['種別'] === k ? 'on' : ''}">${k}</button>`).join('')}</span>
    <label for="f-cross">交差道路</label><input type="text" id="f-cross" list="dl-cross" data-col="交差道路" value="${esc(e['交差道路'])}" placeholder="交差する通りの名前（任意。離脱先のラベルになる）">
  </div>${datalist('dl-point','地点')}${datalist('dl-cross','交差道路')}</fieldset>

  <fieldset><legend>車線（進行方向に向かって左から）</legend>
    <div class="lr"><span>← 左</span><span>右 →</span></div>
    <div class="chips" id="chips">${lanes.length ? lanes.map((c,j) => `<button class="chip ${j === st.lane ? 'on' : ''} ${GLYPH[c] ? '' : 'bad'}" data-j="${j}" title="${esc(CODE_NAME[c] || '不正なコード')}"><span class="n">${j+1}</span><span class="g">${esc(GLYPH[c] || '!')}</span><small>${esc(c)}</small></button>`).join('') : '<span class="empty">未入力（下のボタンで右端に追加）</span>'}</div>
    <div class="palette" id="palette">${st.codes.map(c => `<button data-c="${esc(c)}" title="${esc(CODE_NAME[c])}"><span class="g">${esc(c === 'B' ? '🚌' : GLYPH[c])}</span>${esc(c)} ${esc(CODE_NAME[c])}</button>`).join('')}</div>
    <p class="hint">${st.lane === null ? 'ボタンを押すと右端に追加します。車線をクリックすると選べて、ボタンでその車線を置き換えます。' : `車線${st.lane + 1} を選んでいます。ボタンで置き換え、もう一度クリックで選択解除。`}</p>
    <div class="ops">
      <button class="btn small" id="l-left" ${st.lane === null || st.lane === 0 ? 'disabled' : ''}>◀ 左へ</button>
      <button class="btn small" id="l-right" ${st.lane === null || st.lane >= lanes.length - 1 ? 'disabled' : ''}>右へ ▶</button>
      <button class="btn small" id="l-del" ${st.lane === null ? 'disabled' : ''}>この車線を削除</button>
      <button class="btn small" id="l-clear" ${lanes.length ? '' : 'disabled'}>全部消す（未入力に戻す）</button>
      <button class="btn small" id="l-copy" ${prev && lanesOf(prev).length ? '' : 'disabled'} title="前の行の車線をそのまま写します">前の行から写す</button>
    </div>
    <div class="grid2" style="margin-top:6px"><label for="f-lanes">文字で</label><input type="text" id="f-lanes" data-col="車線" value="${esc(e['車線'])}" placeholder="例: L S S R（半角スペース区切り）"></div>
  </fieldset>

  <fieldset><legend>接続（この行の車線が、次の行でどうなるか）</legend>
    ${renderConn(e, next)}
    <div class="grid2" style="margin-top:6px"><label for="f-conn">文字で</label><input type="text" id="f-conn" data-col="接続" value="${esc(e['接続'])}" placeholder="空欄なら自動補完。例: 1>1 2>2 3>2 4>@五条通"></div>
    <div id="autobox"></div>
  </fieldset>

  <fieldset><legend>出典・確度</legend><div class="grid2">
    <label for="f-src">出典</label><input type="text" id="f-src" list="dl-src" data-col="出典" value="${esc(e['出典'])}" placeholder="例: 近畿地方整備局H29資料／ストリートビュー（撮影年月）／現地">
    <label>確度</label><span class="seg confseg" id="f-conf">${CONFS.map(([v,t]) => `<button data-v="${v}" title="${t}" class="${(e['確度'] || '') === v ? 'on' : ''}">${v || '空欄'}</button>`).join('')}</span>
    <label for="f-memo">メモ</label><textarea id="f-memo" data-col="メモ">${esc(e['メモ'])}</textarea>
  </div>${datalist('dl-src','出典')}
  <div class="ops"><button class="btn small" id="c-copy" ${prev ? '' : 'disabled'}>前の行から出典・確度を写す</button></div></fieldset>

  <fieldset><legend>この行の検証結果</legend><ul class="rowissues" id="rowissues"></ul></fieldset>`;

  // 文字の欄: 打つたびに反映（フォームは描き直さない）
  f.querySelectorAll('[data-col]').forEach(inp => {
    inp.addEventListener('focus', () => { st.pendingUndo = true; });
    inp.addEventListener('input', () => {
      if (st.pendingUndo) { pushUndo(); st.pendingUndo = false; }
      e[inp.dataset.col] = inp.value;
      changed();
    });
    if (inp.dataset.col === '車線' || inp.dataset.col === '接続')
      inp.addEventListener('change', () => { st.lane = null; renderForm(); });
  });
  f.querySelectorAll('#f-kind button').forEach(b => b.onclick = () => edit(() => { e['種別'] = e['種別'] === b.dataset.k ? '' : b.dataset.k; }));
  f.querySelectorAll('#f-conf button').forEach(b => b.onclick = () => edit(() => { e['確度'] = b.dataset.v; }));
  f.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => { const j = +b.dataset.j; st.lane = st.lane === j ? null : j; renderForm(); });
  f.querySelectorAll('#palette button').forEach(b => b.onclick = () => edit(() => {
    const l = lanesOf(e);
    if (st.lane !== null && st.lane < l.length) l[st.lane] = b.dataset.c; else l.push(b.dataset.c);
    e['車線'] = l.join(' ');
  }));
  const moveLane = d => edit(() => { const l = lanesOf(e); const j = st.lane; [l[j], l[j+d]] = [l[j+d], l[j]]; e['車線'] = l.join(' '); st.lane = j + d; });
  $('#l-left').onclick = () => moveLane(-1);
  $('#l-right').onclick = () => moveLane(1);
  $('#l-del').onclick = () => edit(() => { const l = lanesOf(e); l.splice(st.lane, 1); e['車線'] = l.join(' '); st.lane = null; });
  $('#l-clear').onclick = () => edit(() => { e['車線'] = ''; st.lane = null; });
  $('#l-copy').onclick = () => edit(() => { e['車線'] = lanesOf(prev).join(' '); });
  $('#c-copy').onclick = () => edit(() => { e['出典'] = prev['出典'] || ''; e['確度'] = prev['確度'] || ''; });
  bindConn(e, next);
  renderAutoAndIssues();
}

// ---- 接続の編集（車線ごとのプルダウン）
function inferSide(code, j, n){
  const l = code.includes('L'), r = code.includes('R');
  if (l && !r) return 'L';
  if (r && !l) return 'R';
  return (j + 0.5 < n / 2) ? 'L' : 'R';
}
function parseConn(raw, n){
  const toks = (raw || '').trim() ? raw.trim().split(/\s+/) : [];
  const per = Array.from({length:n}, () => []);
  let ok = true;
  for (const t of toks) {
    const m = /^(\d+)>(.+)$/.exec(t);
    if (!m || +m[1] < 1 || +m[1] > n) { ok = false; continue; }
    per[+m[1] - 1].push(m[2]);
  }
  if (per.some(p => p.length > 1)) ok = false;
  return {ok, items: per.map(p => {
    const t = p[0];
    if (t === undefined) return {k:''};
    if (/^\d+$/.test(t)) return {k:'n', d:+t};
    if (t === 'x' || t === 'X') return {k:'x'};
    if (t[0] === '@') { let r = t.slice(1), side = ''; if (r[0] === '<' || r[0] === '>') { side = r[0] === '<' ? 'L' : 'R'; r = r.slice(1); } return {k:'exit', side, name:r}; }
    ok = false; return {k:''};
  })};
}
function buildConn(items, lanes){
  return items.map((it, j) => {
    if (!it.k) return '';
    if (it.k === 'n') return `${j+1}>${it.d}`;
    if (it.k === 'x') return `${j+1}>x`;
    const inferred = inferSide(lanes[j], j, lanes.length);
    const pre = (it.side && it.side !== inferred) ? (it.side === 'L' ? '<' : '>') : '';
    return `${j+1}>@${pre}${(it.name || '').replace(/\s+/g, '')}`;
  }).filter(Boolean).join(' ');
}
function renderConn(e, next){
  const lanes = lanesOf(e);
  if (!lanes.length) return '<p class="hint">先に車線を入力してください。</p>';
  const nl = next ? lanesOf(next) : [];
  const {ok, items} = parseConn(e['接続'], lanes.length);
  if (!ok) return '<p class="hint">いまの接続はプルダウンで表せない書き方（分岐・書き間違いなど）なので、下の「文字で」の欄で直してください。</p>';
  const nextNote = !next ? 'この行は最後の行です（次の行への接続は使われません。側道への離脱は書けます）。'
    : !nl.length ? `次の行（順${esc(next['順'])} ${esc(next['地点'])}）の車線が未入力です。` : `次の行: 順${esc(next['順'])} ${esc(next['地点'])} ${esc(next['種別'])}（${nl.map(c => GLYPH[c] || c).join(' ')}）`;
  const cross = e['交差道路'] || '';
  return `<p class="hint" style="margin:0 0 6px">${nextNote}　すべて「未指定」なら空欄＝自動補完になります。</p><div class="conn" id="conn">` + lanes.map((c, j) => {
    const it = items[j];
    const opts = [['', '未指定'], ...nl.map((nc, k) => [`n:${k+1}`, `→ 次の${k+1}番目（${nc} ${GLYPH[nc] || ''}）`]),
      ['exit', '↪ 側道へ離脱'], ['x', '× 途切れ（行き先なし）']];
    const val = it.k === 'n' ? `n:${it.d}` : it.k;
    if (it.k === 'n' && !(it.d >= 1 && it.d <= nl.length)) opts.push([val, `→ 次の${it.d}番目（存在しない）`]);
    const side = it.side || inferSide(c, j, lanes.length);
    return `<span class="src">車線${j+1} <b>${esc(GLYPH[c] || c)}</b> ${esc(c)}</span><span class="dst">
      <select data-j="${j}" class="c-sel">${opts.map(([v,t]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      ${it.k === 'exit' ? `<select data-j="${j}" class="c-side"><option value="L" ${side === 'L' ? 'selected' : ''}>左へ</option><option value="R" ${side === 'R' ? 'selected' : ''}>右へ</option></select>
      <input type="text" data-j="${j}" class="c-name" value="${esc(it.name || '')}" placeholder="${esc(cross ? '空欄なら ' + cross : '通りの名前（空欄なら交差道路）')}">` : ''}</span>`;
  }).join('') + '</div>';
}
function bindConn(e, next){
  const lanes = lanesOf(e);
  const box = $('#conn'); if (!box) return;
  const read = () => {
    const items = lanes.map(() => ({k:''}));
    box.querySelectorAll('.c-sel').forEach(s => {
      const j = +s.dataset.j, v = s.value;
      if (v.startsWith('n:')) items[j] = {k:'n', d:+v.slice(2)};
      else if (v === 'exit') {
        const side = box.querySelector(`.c-side[data-j="${j}"]`)?.value || inferSide(lanes[j], j, lanes.length);
        items[j] = {k:'exit', side, name: box.querySelector(`.c-name[data-j="${j}"]`)?.value || ''};
      } else items[j] = {k: v};
    });
    return items;
  };
  const apply = () => edit(() => { e['接続'] = buildConn(read(), lanes); });
  box.querySelectorAll('.c-sel, .c-side').forEach(s => s.onchange = apply);
  box.querySelectorAll('.c-name').forEach(s => s.onchange = apply);
}
function renderAutoAndIssues(){
  const e = byId(st.sel); if (!e) return;
  const ab = $('#autobox');
  if (ab) {
    const a = st.preview?.auto?.[e._id];
    if ((e['接続'] || '').trim() || !lanesOf(e).length) ab.innerHTML = '';
    else if (!a) ab.innerHTML = '<div class="auto">空欄（自動補完）：次の行が未入力か最後の行なので、補う接続はありません。</div>';
    else {
      const ng = a.unresolved.length;
      ab.innerHTML = `<div class="auto ${ng ? 'ng' : ''}">空欄（自動補完）の結果：<b>${esc(a.text || 'なし')}</b>${ng ? `<br>車線${a.unresolved.join('・')} は対応を決められません（接続を入力してください）` : ''}
        ${a.text ? ' <button class="btn small" id="autoFill" title="自動補完の結果を接続の欄に書き込みます">この内容を書き込む</button>' : ''}</div>`;
      const b = $('#autoFill'); if (b) b.onclick = () => edit(() => { e['接続'] = a.text; });
    }
  }
  const ri = $('#rowissues');
  if (ri) {
    const iss = issuesOf(e._id);
    ri.innerHTML = iss.length ? iss.map(i => `<li class="lv-${esc(i.level)}">[${esc(i.level)}] ${esc(i.message)}</li>`).join('') : '<li class="muted">問題はありません</li>';
  }
}

// ---- 図と検証結果
function renderPreview(){
  const p = $('#preview');
  const svg = st.preview?.svgs?.[st.dir]?.[st.view];
  p.innerHTML = svg || '<p class="muted">図を作っています…</p>';
  const line = lineOf(st.sel);
  if (line) p.querySelectorAll(`[data-line="${line}"]`).forEach(el => {
    el.classList.add('sel'); el.querySelectorAll('text').forEach(t => t.classList.add('sel'));
  });
}
function renderLint(){
  const iss = (st.preview?.issues || []).filter(i => !i.direction || i.direction === st.dir);
  $('#lint').innerHTML = `<h3>検証結果（${esc(st.dir)}）</h3><ul>` + (iss.length ? iss.map(i =>
    `<li class="lv-${esc(i.level)}" data-line="${i.line ?? ''}">[${esc(i.level)}] ${i.line ? i.line + '行目' : '全体'}${i.where ? ' [' + esc(i.where) + ']' : ''}: ${esc(i.message)}</li>`).join('')
    : '<li class="muted">問題はありません</li>') + '</ul>';
  $('#lint').querySelectorAll('li[data-line]').forEach(li => li.onclick = () => {
    const id = idOfLine(+li.dataset.line); if (id) select(id);
  });
}

// ---------------------------------------------------------------- 行の操作
function newRow(base, extra){
  const e = {_id: `n${Date.now()}_${++st.newId}`};
  st.header.forEach(c => e[c] = '');
  e['方向'] = base ? base['方向'] : (st.dir === 'その他' ? '' : st.dir);
  return Object.assign(e, extra || {});
}
$('#add').onclick = () => edit(() => {
  const cur = byId(st.sel);
  // 手前の行の下には、同じ地点の直後の行を用意する（地点と種別だけ。車線などは空欄）
  const extra = cur && cur['種別'] === '手前' ? {'地点': cur['地点'], '種別': '直後', '交差道路': cur['交差道路']} : {};
  const e = newRow(cur, extra);
  st.entries.splice(cur ? st.entries.indexOf(cur) + 1 : st.entries.length, 0, e);
  sortInsert(e, cur);
  st.sel = e._id; st.lane = null;
});
function sortInsert(e, cur){
  // 一時的に cur の直後に並ぶよう順を決めてから振り直す
  const rows = rowsOf(dirOf(e)).filter(r => r !== e);
  const i = cur ? rows.indexOf(cur) : rows.length - 1;
  rows.splice(i + 1, 0, e);
  rows.forEach((r, k) => r['順'] = String(k + 1));
  renumber(dirOf(e));
}
$('#dup').onclick = () => { const cur = byId(st.sel); if (!cur) return; edit(() => {
  const e = Object.assign(newRow(cur), JSON.parse(JSON.stringify(cur)), {_id: `n${Date.now()}_${++st.newId}`});
  st.entries.splice(st.entries.indexOf(cur) + 1, 0, e);
  sortInsert(e, cur); st.sel = e._id;
}); };
function move(d){
  const cur = byId(st.sel); if (!cur) return;
  const {rows, i} = neighbors(cur); const j = i + d;
  if (j < 0 || j >= rows.length) return;
  edit(() => { [rows[i], rows[j]] = [rows[j], rows[i]]; rows.forEach((r, k) => r['順'] = String(k + 1)); renumber(dirOf(cur)); });
}
$('#up').onclick = () => move(-1);
$('#down').onclick = () => move(1);
$('#del').onclick = () => {
  const cur = byId(st.sel); if (!cur) return;
  const {rows, i} = neighbors(cur);
  edit(() => {
    st.entries.splice(st.entries.indexOf(cur), 1);
    renumber(dirOf(cur));
    st.sel = (rows[i+1] || rows[i-1])?._id || null;
  });
  banner(`行を削除しました（${cur['地点'] || '地点なし'} ${cur['種別']}）。`, 'warn', [['元に戻す', () => { doUndo(); banner(''); }]]);
};
$('#nextBlank').onclick = () => {
  const rows = rowsOf(st.dir); const i = rows.findIndex(e => e._id === st.sel);
  const order = [...rows.slice(i + 1), ...rows.slice(0, i + 1)];
  const t = order.find(e => !lanesOf(e).length);
  if (t) select(t._id); else banner(`${st.dir} に車線が未入力の行はありません。`, 'ok');
};
$('#save').onclick = () => save();
$('#undo').onclick = doUndo;
$('#quit').onclick = async () => {
  if (st.dirty) { banner('未保存の変更があります。保存してから終了するか、変更を捨てて終了してください。', 'warn',
    [['保存して終了', async () => { await save(); if (!st.dirty) quit(); }], ['変更を捨てて終了', quit]]); return; }
  quit();
};
async function quit(){
  st.dirty = false;
  await api('/api/shutdown', {});
  document.body.innerHTML = '<p style="padding:24px">エディタを終了しました。このタブは閉じてかまいません。</p>';
}
$('#preview').addEventListener('click', ev => {
  const el = ev.target.closest('[data-line]'); if (!el) return;
  const id = idOfLine(+el.dataset.line); if (id) select(id);
});
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !typing) { ev.preventDefault(); doUndo(); }
  else if (ev.altKey && ev.shiftKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); move(ev.key === 'ArrowUp' ? -1 : 1); }
  else if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
    ev.preventDefault();
    const rows = rowsOf(st.dir); const i = rows.findIndex(e => e._id === st.sel);
    const t = rows[i + (ev.key === 'ArrowUp' ? -1 : 1)]; if (t) select(t._id);
  }
});
window.addEventListener('beforeunload', ev => { if (st.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
load();
</script>
</body>
</html>
